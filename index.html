<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三年級平板考卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#222;--line:#e8a87c;--accent:#2f6fb5;--bg:#faf8f3;--red:#d33;--green:#2e8b57}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;min-height:58px}
h1{font-size:18px;margin:0;flex:1}
.score{font-size:18px;font-weight:700;color:var(--red)}
button{font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #bbb;background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#back{display:none;padding:8px 12px}
main{padding:16px;max-width:1000px;margin:0 auto}
.hint{color:#666;font-size:14px;line-height:1.6;margin:0 0 12px}
/* home */
.grade{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;padding:4px 14px;font-size:15px;margin-bottom:14px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.subj{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;text-align:left;display:flex;align-items:center;gap:14px;font-size:20px}
.subj .ic{width:52px;height:52px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none}
.subj small{display:block;font-size:13px;color:#888;margin-top:2px}
.exams{display:flex;flex-direction:column;gap:10px}
.examrow{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;text-align:left;display:flex;align-items:center;gap:12px}
.examrow b{flex:1;font-weight:500}
.examrow .last{font-size:14px;color:var(--red)}
.empty{color:#888;padding:20px;text-align:center;background:#fff;border:1px dashed #ccc;border-radius:12px}
/* kids */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.kid-card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:20px}
.avatar{width:72px;height:72px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.kid-card small{font-size:14px;color:#888}
.kid-card.add{border-style:dashed;color:#888;justify-content:center}
.kid-card.add .avatar{background:#eee;color:#999}
.addform{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.addform input,.addform select{font:inherit;font-size:18px;padding:8px 10px;border:1px solid #bbb;border-radius:8px}
.addform input{flex:1;min-width:160px}
.status{color:#888;font-size:14px;margin-top:14px}
.status.warn{color:#b26a00}
.badge{font-size:15px;padding:4px 12px;border-radius:14px;white-space:nowrap}
.badge.done{background:#fdecea;color:var(--red);font-weight:700}
.badge.todo{background:#eee;color:#888}
.examrow .meta{font-size:13px;color:#888;font-weight:400;display:block;margin-top:2px}
.examrow .go{font-size:14px;color:var(--accent);white-space:nowrap}
/* login & parent */
.login{max-width:380px;margin:30px auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font-size:22px;text-align:center}
.login label{font-size:15px;color:#555;display:flex;flex-direction:column;gap:6px}
.login input,.login select{font:inherit;font-size:20px;padding:10px 12px;border:1px solid #bbb;border-radius:10px}
.login input.pin{letter-spacing:10px;text-align:center}
.login .primary{font-size:18px;padding:12px}
.err{color:var(--red);font-size:15px;min-height:20px;text-align:center}
.parentlink{text-align:center;margin-top:8px}
.parentlink button{border:none;background:none;color:#888;font-size:14px;text-decoration:underline}
.plist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.prow{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow .avatar{width:44px;height:44px;font-size:20px}
.prow b{flex:1;font-weight:500;font-size:18px}
.prow b small{display:block;font-size:13px;color:#888;font-weight:400}
.prow button{font-size:14px;padding:6px 12px}
.prow button.danger{color:var(--red);border-color:var(--red)}
.prow .pinedit{display:flex;gap:6px;width:100%}
.prow .pinedit input{font:inherit;font-size:18px;padding:6px 10px;border:1px solid #bbb;border-radius:8px;width:140px;letter-spacing:6px}
h3{font-size:17px;margin:20px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.nopin{color:#b26a00}
.cat{background:#fff;border:1px solid #ddd;border-radius:12px;margin-bottom:10px;overflow:hidden}
.cathead{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cathead .ic{width:40px;height:40px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.cathead b{flex:1;font-size:18px;font-weight:500}
.cathead b small{display:block;font-size:13px;color:#888;font-weight:400}
.catexams{border-top:1px solid #eee;padding:6px 14px 10px 66px}
.catex{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.catex span{flex:1}
.catex small{color:#888;font-size:13px}
.cat.off .cathead b{color:#aaa}
.cat.off .catexams{opacity:.45}
.switch{position:relative;width:52px;height:30px;flex:none;padding:0;border-radius:15px;background:#ccc;border:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--green)}
.switch.on::after{left:25px}
.switch.sm{width:44px;height:26px}
.switch.sm::after{width:20px;height:20px}
.switch.sm.on::after{left:21px}
/* exam */
.sec{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.sec h2{font-size:18px;margin:0 0 12px}
.sec h2 small{font-weight:400;color:#888;font-size:14px}
.q{position:relative;padding:10px 0 10px 34px;border-top:1px dashed #eee;font-size:19px;line-height:1.7}
.q:first-of-type{border-top:0}
.q.is-ok::before,.q.is-ng::before{position:absolute;left:0;top:8px;font-size:26px;line-height:1;color:var(--red);font-weight:700}
.q.is-ok::before{content:"○"}
.q.is-ng::before{content:"✕"}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{font-size:18px;padding:8px 14px}
.opt.sel{background:#e7f0fb;border-color:var(--accent);border-width:2px}
.opt.right{background:#e6f4ea;border-color:var(--green);border-width:2px}
.opt.wrong{background:#fdecea;border-color:var(--red);border-width:2px}
input.ans{font:inherit;font-size:20px;width:110px;padding:4px 8px;border:none;border-bottom:2px solid #999;text-align:center;background:#fffaf5}
input.ans:disabled{color:var(--ink)}
input.ans.right{border-color:var(--green)}
input.ans.wrong{border-color:var(--red)}
.fixtxt{color:var(--red);font-size:16px;margin-left:8px}
.work{margin:8px 0}
.worklbl{font-size:14px;color:#888;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.worklbl button{font-size:14px;padding:4px 10px}
.work canvas{width:100%;height:200px;display:block;border:1px solid #ddd;border-radius:6px;touch-action:none;
 background-color:#fff;background-image:linear-gradient(#eef2f7 1px,transparent 1px),linear-gradient(90deg,#eef2f7 1px,transparent 1px);background-size:24px 24px}
.submitbar{text-align:center;margin:18px 0 40px}
.submitbar button{font-size:18px;padding:12px 40px}
/* vertical 國語 paper */
.paper{writing-mode:vertical-rl;font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;font-size:26px;line-height:2;height:600px;overflow-x:auto;letter-spacing:3px}
.paper p{margin:0 0 0 22px}
.box{display:inline-flex;writing-mode:horizontal-tb;vertical-align:middle;margin:6px 0;border:1.5px solid var(--line);background:#fff;letter-spacing:0;position:relative;cursor:pointer}
.box.given{cursor:default}
.cell{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1}
.cell img{width:100%;height:100%;display:block}
.box:not(.given) .cell:empty{background:#fffaf5}
.zy{width:22px;border-left:1px solid var(--line);writing-mode:vertical-rl;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:13px;line-height:22px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.box.ok::after,.box.ng::after{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--red);pointer-events:none;font-family:sans-serif}
.box.ok::after{content:"";border:3px solid var(--red);border-radius:50%;inset:6px 28px 6px 6px}
.box.ng::after{content:"✕";font-size:46px;opacity:.75;inset:0 22px 0 0}
.box .fix{position:absolute;top:-10px;left:-14px;background:var(--red);color:#fff;font-size:15px;line-height:1;padding:3px 4px;border-radius:4px;font-family:sans-serif;writing-mode:horizontal-tb;z-index:1}
/* writing pad */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.pad{background:#fff;border-radius:14px;padding:16px 18px;text-align:center;max-width:94vw}
.padtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.padzy{font-size:26px;font-weight:700;letter-spacing:2px}
.padctx{font-size:14px;color:#777}
.cvwrap{width:min(78vw,60vh,380px);height:min(78vw,60vh,380px);border:2px solid var(--line);margin:0 auto;
 background:
  linear-gradient(to right,transparent calc(50% - .5px),#f4d2b8 calc(50% - .5px),#f4d2b8 calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),#f4d2b8 calc(50% - .5px),#f4d2b8 calc(50% + .5px),transparent calc(50% + .5px)),#fff}
#cv{width:100%;height:100%;display:block;touch-action:none}
.padbtns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* parent grading */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}
.kid{width:64px;height:64px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px}
.kid img{width:100%;height:100%}
.ansbox{flex:1;font-size:13px;color:#777}
.ansbox b{display:block;font-size:30px;color:var(--ink);font-family:"Noto Serif TC","PMingLiU",serif;font-weight:400}
.mk{display:flex;flex-direction:column;gap:6px}
.mk button{padding:4px 10px;font-size:18px}
.mk button.on{background:var(--red);color:#fff;border-color:var(--red)}

/* new types */
.paper{width:100%;max-width:100%;text-orientation:upright}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px;direction:rtl}
.minis > *{direction:ltr}
.paper.mini{height:auto;width:auto;overflow:visible;padding:4px 0}
.paper.mini p{margin:0}
.minicard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fffdf8;border:1.5px solid #e9dccb;border-radius:12px;padding:8px 6px 10px;min-width:0;overflow:hidden}
.minicard .paper.mini{max-width:100%;height:auto;overflow:visible}
.mininum{font-size:18px;font-weight:700;color:#fff;background:var(--accent);border-radius:12px;padding:1px 10px;font-family:sans-serif}
.zy img{width:100%;height:100%;object-fit:contain;display:block}
.box.askzy .zy{background:#fffaf5;cursor:pointer}
.box.askzy{cursor:pointer}
.hboxes{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.hbox{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:#888}
.box.nozy .zy{display:none}
.box.nozy.ok::after{inset:7px}
.box.nozy.ng::after{inset:0}
.qt{white-space:pre-line}
.passage{white-space:pre-line;font-size:22px;line-height:1.9;background:#fbf8f1;border-radius:10px;padding:16px 20px;font-family:"Noto Serif TC","PMingLiU",serif}
.passage img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:6px}
.opt.multi::before{content:"□ ";}
.opt.multi.sel::before{content:"☑ ";}
.card.wide{grid-column:1/-1;align-items:flex-start}
.card.wide .kid{width:auto;flex:1;height:auto;min-height:90px;border-color:#ddd}
.card.wide .kid img{width:100%;height:auto}
.card.wide .ansbox{flex:0 0 32%;font-size:15px;color:#555}
.card.wide .ansbox b{font-size:15px;font-family:inherit;color:#888;font-weight:400}
.ansbox.zy b{font-size:26px}
/* words practice */
.kindtitle{font-size:20px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.kindtitle:first-child{margin-top:4px}
.wp{display:flex;flex-direction:column;align-items:center;gap:14px}
.wpbar{width:100%;display:flex;align-items:center;gap:12px;font-size:17px;color:#666}
.wpbar .track{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.wpbar .fill{height:100%;background:var(--green);transition:width .3s}
.wpstep{font-size:18px;font-weight:700;padding:6px 16px;border-radius:16px;background:#e7f0fb;color:var(--accent)}
.wpstep.s2{background:#fdf1e3;color:#b26a00}
.wpq{display:flex;align-items:center;gap:22px}
.wpzy{writing-mode:vertical-rl;font-size:34px;font-weight:700;letter-spacing:4px;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
.wpword{font-size:40px;font-family:"BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Serif TC",serif;letter-spacing:6px}
.wpword .blank{display:inline-block;width:1.1em;border-bottom:3px solid #999;margin:0 2px}
.wpbox{position:relative;width:min(80vw,52vh,500px);height:min(80vw,52vh,500px);border:3px solid var(--line);background:
  linear-gradient(to right,transparent calc(50% - .5px),#f4d2b8 calc(50% - .5px),#f4d2b8 calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),#f4d2b8 calc(50% - .5px),#f4d2b8 calc(50% + .5px),transparent calc(50% + .5px)),#fff}
.wpbox .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(64vw,42vh,400px);line-height:1;color:#000;opacity:.13;font-family:"BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Serif TC",serif;pointer-events:none}
.wpbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wpbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.wpbtns button{font-size:20px;padding:12px 24px;min-height:58px}
.wpcheck{display:flex;align-items:center;gap:26px;font-size:18px;color:#666}
.wpcheck .ans{font-size:110px;line-height:1;color:var(--ink);font-family:"BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Serif TC",serif}
.wpcheck img{width:120px;height:120px;border:2px solid var(--line);background:#fff}
.wpdone{text-align:center;font-size:22px;line-height:1.8}
.wpdone .big{font-size:48px}
.wpdone .chars{font-size:40px;letter-spacing:10px;color:var(--red);font-family:"BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Serif TC",serif}
.wppts{font-weight:700;color:#b26a00;font-size:19px;white-space:nowrap}
.wpscore{font-size:30px;font-weight:700;color:#b26a00}
.wpflash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:56px;font-weight:800;color:#e08a00;text-shadow:0 2px 0 #fff,0 0 12px #fff;pointer-events:none;z-index:50;animation:wpup .9s ease-out forwards}
@keyframes wpup{from{opacity:1;transform:translate(-50%,-30%) scale(.8)}to{opacity:0;transform:translate(-50%,-90%) scale(1.15)}}
.mistbox{background:#fff;border:1px solid #f0c9c9;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.mistgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.mistch{border:1.5px solid #f3d6d6;background:#fff8f8;border-radius:12px;padding:8px;text-align:center}
.mistch .mc{font-size:46px;line-height:1.1;font-family:"BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Serif TC",serif}
.mistch .mz{font-size:15px;color:#555}
.mistch .mw{font-size:16px;color:#333}
.mistch .mn{font-size:14px;color:var(--red);font-weight:700;margin-top:2px}
.mistbox .primary{font-size:20px;min-height:58px}
.qimg{display:block;max-width:100%;max-height:220px;margin:8px 0;border-radius:6px}
.optlist{display:grid;max-width:760px;gap:6px 18px;font-size:21px;line-height:1.5;color:#333;margin:6px 0 4px}
.optitem{display:flex;gap:6px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.optitem b{flex:none;color:var(--accent)}
.qt{overflow-wrap:anywhere}
.opts.codes{gap:14px}
.opts.codes .opt{min-width:70px;min-height:62px;font-size:30px;padding:4px 16px;border-radius:14px;font-weight:700}
/* ===== 平板尺寸（iPad 等 10～13 吋，直放橫放都可）：字更大、按鈕更好點 ===== */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.box,.subj,.examrow,.kid-card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font-size:18px;min-height:48px;padding:10px 20px;border-radius:12px}
header{min-height:72px;padding:12px 24px;gap:14px}
h1{font-size:22px}
#back{font-size:18px;padding:10px 18px}
.score{font-size:22px}
main{padding:24px 28px;max-width:1200px}
.hint{font-size:16px}
.status{font-size:15px}
.err{font-size:17px}
/* 登入 */
.login{max-width:500px;margin:6vh auto 0;padding:34px 32px;gap:18px;border-radius:20px}
.login h2{font-size:28px}
.login label{font-size:17px}
.login input,.login select{font-size:26px;padding:14px 16px;border-radius:12px}
.login input.pin{letter-spacing:16px}
.login .primary{font-size:22px;padding:16px;min-height:60px}
.parentlink button{font-size:16px;min-height:44px}
/* 科目 */
.subjects{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.subj{padding:26px 22px;font-size:26px;border-radius:18px;gap:18px}
.subj .ic{width:72px;height:72px;font-size:34px;border-radius:16px}
.subj small{font-size:16px;margin-top:4px}
/* 考卷列表 */
.exams{gap:14px}
.examrow{padding:22px 24px;border-radius:16px;font-size:21px;min-height:84px}
.examrow .meta{font-size:15px;margin-top:4px}
.badge{font-size:19px;padding:6px 16px;border-radius:18px}
.examrow .go{font-size:18px}
.empty{font-size:18px;padding:30px}
/* 作答 */
.sec{padding:22px 26px;border-radius:14px;margin-bottom:18px}
.sec h2{font-size:22px}
.sec h2 small{font-size:16px}
.q{font-size:23px;padding:14px 0 14px 44px;line-height:1.8}
.q.is-ok::before,.q.is-ng::before{font-size:32px;top:12px}
.opts{gap:12px;margin-top:10px}
.opt{font-size:21px;padding:12px 22px;min-height:56px}
input.ans{font-size:26px;width:150px;height:50px}
.fixtxt{font-size:18px}
.worklbl{font-size:16px}
.worklbl button{font-size:16px;min-height:40px;padding:6px 14px}
.work canvas{height:280px}
.submitbar button{font-size:22px;padding:16px 60px;min-height:62px}
/* 國語直式考卷：高度跟著螢幕 */
.paper{height:max(520px,calc(100vh - 290px));font-size:30px}
.cell{width:70px;height:70px;font-size:48px}

/* ================= 遊戲風格主題 ================= */
:root{--ink:#1f2433;--outline:#1f2433;--sky1:#4fc3ff;--sky2:#a9e7ff;--grass:#7ed957;--accent:#2f80ed;--green:#25b04c;--red:#e5484d;--gold:#ffc83d}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,#d6f6ff 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60px 26px at 12% 14%,#fff 98%,transparent),radial-gradient(44px 22px at 17% 11%,#fff 98%,transparent),
   radial-gradient(70px 28px at 78% 9%,#fff 98%,transparent),radial-gradient(46px 22px at 84% 6%,#fff 98%,transparent),
   radial-gradient(54px 22px at 55% 22%,rgba(255,255,255,.8) 98%,transparent),
   linear-gradient(180deg,transparent 86%,#8bdc63 86%,#8bdc63 88%,#6cc24a 88%);
  opacity:.9}
header{background:rgba(31,36,51,.88);border-bottom:none;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);backdrop-filter:blur(6px)}
h1{color:#fff;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px}
h1 .hdav{width:44px;height:44px;border-radius:12px;background:#fff;display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;border:3px solid var(--gold);flex:none}
h1 .hdav svg{width:40px;height:54px;margin-bottom:-12px}
.score{color:var(--gold);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.35)}
button{font-family:inherit;font-weight:900;border:3px solid var(--outline);border-radius:14px;background:#fff;color:var(--ink);
  box-shadow:0 5px 0 var(--outline);transition:transform .06s,box-shadow .06s;position:relative;top:0}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
button:disabled{opacity:.6}
button.primary{background:var(--green);color:#fff;border-color:var(--outline);text-shadow:0 2px 0 rgba(0,0,0,.25)}
#back{background:var(--gold);color:var(--ink);border-color:#1f2433}
.sec,.login,.examrow,.subj,.mistbox,.prow,.cat,.addform,.card,.empty,.minicard,.wpdone,.kid-hero{
  border:4px solid var(--outline)!important;border-radius:20px!important;box-shadow:0 7px 0 rgba(31,36,51,.9)!important}
.sec{background:#fff}
.sec h2{font-weight:900;display:inline-block;background:var(--gold);padding:4px 14px;border-radius:12px;border:3px solid var(--outline);box-shadow:0 3px 0 var(--outline)}
.sec h2 small{color:#5a4300}
.hint{color:#34405c;font-weight:500}
h3,.kindtitle{font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(31,36,51,.55),0 0 2px #1f2433}
.kindtitle small.hint{display:block;margin:2px 0 0;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(31,36,51,.5);font-weight:700}
.empty{background:rgba(255,255,255,.9);color:#34405c}
.status{color:#1f2433;background:rgba(255,255,255,.7);border-radius:10px;padding:6px 10px;display:inline-block}
/* 登入 */
.login{background:#fff;position:relative}
.login h2{font-weight:900}
.login input,.login select,.addform input,.addform select,input.ans{border:3px solid var(--outline);border-radius:12px;font-weight:700;background:#fffdf3}
.login input:focus,input.ans:focus{outline:none;box-shadow:0 0 0 4px rgba(47,128,237,.35)}
.parentlink button{box-shadow:none;border:none;background:transparent;color:#1f2433;text-decoration:underline}
.logo{text-align:center;margin:3vh 0 0;font-weight:900;font-size:44px;color:#fff;letter-spacing:4px;
  text-shadow:0 4px 0 #1f2433,3px 3px 0 #1f2433,-3px 3px 0 #1f2433,3px -1px 0 #1f2433,-3px -1px 0 #1f2433}
.logo small{display:block;font-size:18px;letter-spacing:2px;text-shadow:0 2px 0 #1f2433}
.login .bigav{display:flex;justify-content:center;margin:-6px 0 0}
.login .bigav svg{width:120px;height:160px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
/* 選角色 */
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.avcard{display:flex;flex-direction:column;align-items:center;padding:12px 8px 10px;background:linear-gradient(180deg,#e9f7ff,#fff);border-radius:18px}
.avcard svg{width:100px;height:134px}
.avcard span{font-size:20px;margin-top:4px}
.avcard.sel{background:linear-gradient(180deg,#fff3c4,#ffe07a);border-color:#1f2433;transform:translateY(-4px)}
.avcard.sel::after{content:"✔";position:absolute;top:-12px;right:-12px;width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;border:3px solid #1f2433;display:flex;align-items:center;justify-content:center;font-size:20px}
.avpick-title{font-size:30px;font-weight:900;color:#fff;text-align:center;margin:6px 0 16px;text-shadow:0 3px 0 #1f2433,2px 2px 0 #1f2433,-2px 2px 0 #1f2433}
.avpick-go{display:flex;justify-content:center;margin:22px 0 40px}
.avpick-go button{font-size:24px;padding:14px 50px;min-height:66px}
/* 小朋友首頁 */
.kid-hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#fff 0%,#fff6d6 100%);padding:14px 20px;margin-bottom:22px}
.kid-hero .heroav{width:110px;height:120px;display:flex;align-items:flex-end;justify-content:center;background:#bfe9ff;border-radius:16px;border:3px solid #1f2433;overflow:hidden;flex:none}
.kid-hero .heroav svg{width:96px;height:128px;margin-bottom:-14px}
.kid-hero .info{flex:1}
.kid-hero .nm{font-size:30px;font-weight:900}
.kid-hero .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{background:#1f2433;color:#fff;border-radius:999px;padding:4px 14px;font-size:17px}
.chip.gold{background:var(--gold);color:#1f2433;border:2px solid #1f2433}
.kid-hero button{font-size:16px;padding:8px 14px;min-height:44px}
.subjects{gap:20px}
.subj{color:#fff;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 14px 20px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.subj .ic{width:84px;height:84px;font-size:42px;border-radius:18px;background:#fff!important;border:4px solid #1f2433;box-shadow:0 4px 0 rgba(0,0,0,.25);text-shadow:none}
.subj small{color:#fff;font-weight:700;background:rgba(0,0,0,.22);padding:3px 12px;border-radius:999px;text-shadow:none}
.subj .bar{width:80%;height:12px;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden;border:2px solid rgba(31,36,51,.6)}
.subj .bar i{display:block;height:100%;background:var(--gold)}
/* 關卡列表 */
.examrow{background:#fff;gap:16px}
.examrow::before{content:attr(data-n);flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;border:3px solid #1f2433;box-shadow:0 3px 0 #1f2433}
.examrow.cleared::before{background:var(--green);content:"★"}
.examrow b{font-weight:900}
.badge{border:3px solid #1f2433;font-weight:900}
.badge.done{background:var(--gold);color:#1f2433}
.badge.todo{background:#e9eef5;color:#5a6680}
.examrow .go{background:var(--green);color:#fff;border:3px solid #1f2433;border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 #1f2433;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.25)}
/* 作答 */
.opt{border-width:3px}
.opt.sel{background:#cfe5ff;border-color:#1f2433;border-width:3px;transform:translateY(3px);box-shadow:0 2px 0 #1f2433}
.opt.right{background:#b9f0c6;border-color:#1f2433;border-width:3px}
.opt.wrong{background:#ffc9c9;border-color:#1f2433;border-width:3px}
.q.is-ok::before{color:var(--green)}
.passage{border:3px dashed #c9b88a}
.submitbar button.primary{font-size:26px;padding:16px 70px}
.pad{border:4px solid #1f2433;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.cvwrap,.wpbox{border-color:#1f2433!important;border-radius:10px}
/* 生字練習 */
.wpstep{border:3px solid #1f2433;box-shadow:0 3px 0 #1f2433}
.wpbar .track{border:3px solid #1f2433;height:18px;border-radius:9px;background:#fff}
.wpbar .fill{background:linear-gradient(90deg,#7ed957,#25b04c)}
.wpbar{color:#1f2433;font-weight:900}
.wppts{background:var(--gold);border:3px solid #1f2433;border-radius:999px;padding:2px 12px;color:#1f2433!important}
.wpq{background:#fff;border:4px solid #1f2433;border-radius:18px;padding:8px 22px;box-shadow:0 5px 0 rgba(31,36,51,.9)}
.wpdone{background:#fff;padding:24px}
.wpflash{color:var(--gold);-webkit-text-stroke:3px #1f2433;text-shadow:0 5px 0 #1f2433}
/* 慶祝 */
.confetti{position:fixed;top:-20px;width:14px;height:14px;z-index:60;pointer-events:none;border:2px solid #1f2433;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.levelup{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:61;background:#fff;border:5px solid #1f2433;border-radius:24px;box-shadow:0 10px 0 #1f2433;padding:22px 40px;text-align:center;animation:pop .35s ease-out}
.levelup .big{white-space:nowrap;font-size:40px;font-weight:900;color:#1f2433}
.levelup .sc{font-size:64px;font-weight:900;color:var(--gold);-webkit-text-stroke:3px #1f2433}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}
/* 家長管理沿用但較素 */
.tabs button.on{background:var(--accent);color:#fff}
.prow .avatar{background:#bfe9ff!important;border:3px solid #1f2433;overflow:hidden;align-items:flex-end}
.prow .avatar svg{width:44px;height:58px;margin-bottom:-12px}

/* ================= 戰場模式 ================= */
body{background:linear-gradient(180deg,#241a4d 0%,#4a2f7a 30%,#c2557a 62%,#ff9a5a 80%,#ffcf7a 90%) fixed}
body::before{background:
  radial-gradient(2px 2px at 10% 8%,#fff 99%,transparent),radial-gradient(2px 2px at 30% 14%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 52% 6%,#fff 99%,transparent),
  radial-gradient(2px 2px at 70% 12%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 88% 4%,#fff 99%,transparent),radial-gradient(2px 2px at 92% 20%,#fff 99%,transparent),
  linear-gradient(170deg,transparent 78%,#3b2a5c 78%,#3b2a5c 84%,transparent 84%),
  linear-gradient(190deg,transparent 80%,#4b3570 80%,#4b3570 86%,transparent 86%),
  linear-gradient(180deg,transparent 88%,#6b4a2b 88%,#6b4a2b 90%,#4e3520 90%);opacity:1}
.logo{color:#ffd36e}
.logo small{color:#fff}
.avpick-title,h3,.kindtitle{color:#ffd36e}
.arena{position:sticky;top:72px;z-index:4;display:flex;align-items:center;gap:10px;margin:-6px 0 18px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(31,24,64,.95),rgba(58,36,96,.95));border:4px solid #1f2433;border-radius:20px;box-shadow:0 7px 0 rgba(0,0,0,.45);color:#fff}
.fighter{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.fighter.foe{justify-content:flex-end;text-align:right}
.fighter .sprite{flex:none;width:76px;height:84px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.fighter.me .sprite svg{width:62px;height:83px}
.fighter.foe .sprite svg{width:82px;height:82px}
.fighter .stat{min-width:0;flex:1}
.fighter .stat b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffd36e}
.hearts{font-size:18px;letter-spacing:1px}.hearts .lost{opacity:.5}
.hpbar{position:relative;height:22px;background:#2a1c45;border:3px solid #000;border-radius:11px;overflow:hidden;margin-top:4px}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#7cf06a,#25b04c);transition:width .4s ease-out}
.hpbar i.mid{background:linear-gradient(180deg,#ffe066,#f2b400)}
.hpbar i.low{background:linear-gradient(180deg,#ff7a7a,#d6303a)}
.hpbar span{position:relative;font-size:13px;font-weight:900;display:block;text-align:center;line-height:16px;text-shadow:0 1px 0 #000}
.vs{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.vsx{font-size:28px;font-weight:900;color:#ff5a5a;-webkit-text-stroke:2px #000;font-style:italic}
.combo{font-size:15px;font-weight:900;color:#ffd36e;min-height:20px;transform:scale(.6);opacity:0;transition:.2s}
.combo.show{transform:scale(1.15);opacity:1}
.sfxbtn{font-size:18px;min-height:0;padding:2px 8px;border-width:2px;box-shadow:0 2px 0 #1f2433;border-radius:10px}
.lunge{animation:lunge .32s ease-out}.lunge-l{animation:lungel .32s ease-out}
@keyframes lunge{40%{transform:translateX(26px) scale(1.08)}}
@keyframes lungel{40%{transform:translateX(-26px) scale(1.08)}}
.hurt{animation:hurt .45s}
@keyframes hurt{0%,100%{filter:none;transform:none}20%{filter:brightness(2.2) drop-shadow(0 0 6px #fff);transform:translateX(-6px) rotate(-4deg)}50%{transform:translateX(6px) rotate(3deg)}70%{filter:brightness(1.6)}}
.sprite.dead{animation:die .9s forwards}
@keyframes die{30%{transform:scale(1.2) rotate(-8deg)}100%{transform:translateY(20px) scale(.4) rotate(30deg);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.dmg{position:fixed;z-index:70;pointer-events:none;transform:translateX(-50%);font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:2px #1f2433;text-shadow:0 3px 0 #1f2433;animation:dmg .9s ease-out forwards;white-space:nowrap}
.dmg.crit{color:#ffd36e;font-size:38px}.dmg.bad{color:#ff6b6b}.dmg.ko{color:#ff5a5a;font-size:44px}
@keyframes dmg{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
.bolt{position:fixed;z-index:69;pointer-events:none;font-size:34px;transition:transform .35s ease-in,opacity .35s;margin:-20px 0 0 -14px}
.opt.locked{pointer-events:none}
.subj .ic{width:96px!important;height:96px!important;background:#fff!important;display:flex;align-items:center;justify-content:center;padding:4px}
.subj .ic svg{width:84px;height:84px}
.wpbar{color:#fff!important;text-shadow:0 2px 0 #1f2433}
.subj .boss{font-size:14px;color:#fff;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:999px;text-shadow:none}
@media (max-width:600px){.arena{top:64px}.fighter .sprite{width:56px;height:64px}.fighter.foe .sprite svg{width:60px;height:60px}.fighter.me .sprite svg{width:46px;height:62px}.vs{width:60px}}

.parentlink button{color:#fff!important;text-shadow:0 2px 0 #1f2433}
.loginsel{margin:18px auto 0;max-width:900px}
.step{display:inline-block;font-size:20px;font-weight:900;color:#1f2433;background:#ffd36e;border:3px solid #1f2433;border-radius:12px;padding:3px 14px;box-shadow:0 3px 0 #1f2433;margin-bottom:12px}
.avgrid.mini{grid-template-columns:repeat(6,1fr);gap:10px}
.avgrid.mini .avcard{padding:6px 2px 6px;border-radius:14px}
.avgrid.mini .avcard svg{width:70px;height:94px}
.avgrid.mini .avcard span{font-size:15px;margin-top:2px}
.login{margin-top:22px}
@media (max-width:700px){.avgrid.mini{grid-template-columns:repeat(4,1fr)}}

/* ===== 數字鍵盤／直式／乘法闖關 ===== */
input.ans.num{cursor:pointer;caret-color:transparent}
.kfocus{outline:4px solid #ffc83d!important;outline-offset:2px;background:#fff6cf!important}
.numkey{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(31,24,64,.97);border-top:4px solid #1f2433;padding:12px 14px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s}
.numkey.show{transform:none}
.nkrow,.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:0 auto}
.nkrow button,.dpad button{font-size:30px;min-height:62px;border-radius:14px}
.nkrow button.bs,.dpad button.bs{background:#ffe0e0}
body.nkopen main{padding-bottom:320px}
.ansline{font-size:22px;margin-top:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.vq{border:3px solid #e5e0d0!important;border-radius:14px;padding:10px 12px 12px!important;background:#fffdf6;min-width:0;overflow:hidden}
.vq .fixtxt{display:block;text-align:center;margin:4px 0 0}
.vq .qt{font-size:18px;color:#777}
.vtable{display:block;width:max-content;max-width:100%;margin:2px auto 4px;font-family:Menlo,Consolas,"Courier New",monospace;font-size:30px;font-weight:900;line-height:1}
.vrow{display:grid;grid-template-columns:repeat(var(--w),42px);height:44px;align-items:center}
.vrow .vc{display:flex;align-items:center;justify-content:center;height:100%}
.vrow.carry{height:30px}
.vrow.under{border-bottom:4px solid #1f2433}
.vmini{width:26px;height:24px;border:2px dashed #b9c2d3;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center;color:#d6303a;cursor:pointer}
.vrow.ansrow{height:56px}
.dcell{width:38px;height:46px;border:3px solid #1f2433;border-radius:8px;background:#fffdf3;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}
.dcell.right{background:#b9f0c6}.dcell.wrong{background:#ffc9c9}.dcell.locked{pointer-events:none}
.vq.is-ok::before,.vq.is-ng::before{left:auto;right:10px;top:8px}
.drill{display:flex;flex-direction:column;align-items:center;gap:14px}
.dcard{width:100%;max-width:620px;background:#fff;border:4px solid #1f2433;border-radius:22px;box-shadow:0 7px 0 rgba(31,36,51,.9);padding:22px 10px;text-align:center;transition:background .2s}
.dcard.good{background:#d9fbe1}.dcard.bad{background:#ffe0e0;animation:shake .35s}
.dq{font-size:64px;font-weight:900;font-family:Arial,sans-serif;letter-spacing:2px}
.dbox{display:inline-block;min-width:1.4em;border:4px solid #1f2433;border-radius:14px;background:#fff6cf;padding:0 10px;line-height:1.2}
.dmsg{min-height:30px;font-size:22px;margin-top:6px}.dmsg.ok{color:#1d8a3b}.dmsg.bad{color:#d6303a}
.dtimer{width:100%;max-width:620px;height:12px;border:3px solid #1f2433;border-radius:8px;background:#fff;overflow:hidden}
.dtimer i{display:block;height:100%;background:#25b04c}.dtimer i.slow{background:#f2b400}
.dpad{width:100%}
.dpad button{min-height:74px;font-size:34px}

/* ================= 動態與設計感 ================= */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.95)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
@keyframes glow{0%,100%{text-shadow:0 4px 0 #1f2433,3px 3px 0 #1f2433,-3px 3px 0 #1f2433,0 0 0 rgba(255,211,110,0)}50%{text-shadow:0 4px 0 #1f2433,3px 3px 0 #1f2433,-3px 3px 0 #1f2433,0 0 22px rgba(255,211,110,.9)}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
/* 背景：閃爍星星、飄動的光點 */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(2.5px 2.5px at 18% 22%,#fff 99%,transparent),radial-gradient(2px 2px at 42% 9%,#fff 99%,transparent),
  radial-gradient(2.5px 2.5px at 64% 18%,#ffe9a8 99%,transparent),radial-gradient(2px 2px at 82% 30%,#fff 99%,transparent),radial-gradient(3px 3px at 6% 34%,#ffe9a8 99%,transparent);
  animation:twinkle 3.2s ease-in-out infinite}
.fx{position:fixed;z-index:-1;pointer-events:none;font-size:22px;opacity:.55;animation:floaty 6s ease-in-out infinite}
/* 標題 */
header{background:linear-gradient(90deg,rgba(31,24,64,.92),rgba(74,47,122,.92));border-bottom:3px solid rgba(255,211,110,.5)}
.logo{animation:glow 3s ease-in-out infinite,bob 4s ease-in-out infinite}
/* 人偶與怪獸會呼吸、上下浮動 */
.avcard svg,.heroav svg,.bigav svg,.fighter.me .sprite svg,h1 .hdav svg{animation:bob 2.4s ease-in-out infinite}
.avgrid .avcard:nth-child(3n+2) svg{animation-delay:-.8s}.avgrid .avcard:nth-child(3n) svg{animation-delay:-1.6s}
.fighter.foe .sprite svg,.subj .ic svg{animation:breathe 2s ease-in-out infinite;transform-origin:50% 90%}
.avcard.sel svg{animation:bob .9s ease-in-out infinite}
.avcard:hover{transform:translateY(-4px)}
.avcard{transition:transform .15s}
/* 進場動畫（一張一張出現） */
.avcard,.subj,.examrow,.sec,.login,.kid-hero,.arena,.dcard,.mistbox,.wpq{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.avgrid .avcard:nth-child(1),.subjects .subj:nth-child(1),.exams .examrow:nth-child(1){animation-delay:.03s}
.avgrid .avcard:nth-child(2),.subjects .subj:nth-child(2),.exams .examrow:nth-child(2){animation-delay:.08s}
.avgrid .avcard:nth-child(3),.subjects .subj:nth-child(3),.exams .examrow:nth-child(3){animation-delay:.13s}
.avgrid .avcard:nth-child(4),.subjects .subj:nth-child(4),.exams .examrow:nth-child(4){animation-delay:.18s}
.avgrid .avcard:nth-child(5),.subjects .subj:nth-child(5),.exams .examrow:nth-child(5){animation-delay:.23s}
.avgrid .avcard:nth-child(6),.exams .examrow:nth-child(6){animation-delay:.28s}
.avgrid .avcard:nth-child(7),.exams .examrow:nth-child(7){animation-delay:.33s}
.avgrid .avcard:nth-child(8),.exams .examrow:nth-child(8){animation-delay:.38s}
.avgrid .avcard:nth-child(n+9){animation-delay:.43s}
/* 科目方塊：光澤掃過、按下彈跳 */
.subj{position:relative;overflow:hidden;background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(0,0,0,.12))}
.subj::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.subjects .subj:nth-child(2)::after{animation-delay:.9s}.subjects .subj:nth-child(3)::after{animation-delay:1.8s}.subjects .subj:nth-child(4)::after{animation-delay:2.7s}.subjects .subj:nth-child(5)::after{animation-delay:3.6s}
.subj:hover .ic{animation:wiggle .5s ease-in-out}
/* 按鈕：主要按鈕有光澤 */
button.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#36c95f,#1f9d43)}
button.primary::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite;pointer-events:none}
.examrow{transition:transform .15s}
.examrow:hover{transform:translateX(4px)}
.examrow:not(.cleared)::before{animation:pulse 2.2s ease-in-out infinite}
.chip.gold{position:relative;overflow:hidden}
.chip.gold::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 3.5s infinite}
.vsx{animation:pulse 1.4s ease-in-out infinite}
.hpbar i::after{content:"";position:absolute;inset:0 0 50% 0;background:rgba(255,255,255,.35);border-radius:6px}
.kid-hero{background:linear-gradient(120deg,#fff 0%,#fff6d6 60%,#ffe7a3 100%)}
.opt{transition:transform .1s,background .15s}
.opt:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== 平板橫放（高度較矮）時的版面 ===== */
@media (orientation: landscape) and (max-height: 900px){
  main{padding-top:14px}
  .arena{padding:6px 14px;margin:-4px 0 10px}
  .fighter .sprite{width:58px;height:64px}
  .fighter.foe .sprite svg{width:60px;height:60px}
  .fighter.me .sprite svg{width:46px;height:62px}
  .wp{display:grid;grid-template-columns:1fr auto;column-gap:28px;row-gap:12px;align-items:center;justify-items:center}
  .wp > .wpbar,.wp > .wpdone{grid-column:1/-1}
  .wp > .wpstep,.wp > .wpq,.wp > .wpbtns,.wp > .wpcheck{grid-column:1}
  .wp > .wpbox{grid-column:2;grid-row:2/span 3;width:min(46vw,calc(100vh - 230px));height:min(46vw,calc(100vh - 230px))}
  .wp > .wpbox .ghost{font-size:calc(min(46vw,100vh - 230px) * .8)}
  .wp > .wpdone + .wpbtns{grid-column:1/-1}
  .drill{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;align-items:center}
  .drill > .wpbar,.drill > .wpdone,.drill > .wpbtns{grid-column:1/-1}
  .drill > .dcard,.drill > .dtimer{grid-column:1}
  .drill > .dpad{grid-column:2;grid-row:2/span 2}
  .dq{font-size:56px}
  .dpad button{min-height:68px}
  .numkey{padding-top:8px;padding-bottom:8px}
  .nkrow{grid-template-columns:repeat(6,1fr);max-width:900px}
  .nkrow button{min-height:56px}
  body.nkopen main{padding-bottom:180px}
}

/* ================= 精修：遊戲 UI ================= */
body,button,input{font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{background:linear-gradient(180deg,#1b1240 0%,#3a2470 38%,#b64f7a 70%,#ff9a5a 86%,#ffcf7a 100%) fixed}

/* ---------- 資料儲存：有雲端資料庫就存雲端（換裝置也看得到），沒有就存在這台平板 ---------- */
const Store = {
  db: null,
  cat: { hiddenSubjects: [], hiddenExams: [], deletedExams: [] },
  ready: null,
  timeout(p) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000))]); },
  local(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  },
  async kids() {
    if (this.db) {
      const snap = await this.timeout(this.db.collection('kids').orderBy('createdAt').get());
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    return this.local('kids') || [];
  },
  async addKid(name, grade, salt, pinHash, avatar) {
    const kid = { name, grade, salt, pinHash, avatar: avatar || 'knight', createdAt: Date.now() };
    if (this.db) { const ref = await this.db.collection('kids').add(kid); return { id: ref.id, ...kid }; }
    const list = this.local('kids') || []; const k = { id: 'k' + Date.now(), ...kid };
    list.push(k); this.local('kids', list); return k;
  },
  async updateKid(id, fields) {
    if (this.db) return this.db.doc(`kids/${id}`).update(fields);
    const list = this.local('kids') || []; const k = list.find(x => x.id === id); Object.assign(k, fields); this.local('kids', list);
  },
  async deleteKid(id) {
    if (this.db) return this.db.doc(`kids/${id}`).delete();
    this.local('kids', (this.local('kids') || []).filter(x => x.id !== id));
  },
  async parentHash() {
    if (this.db) { const d = await this.timeout(this.db.doc('settings/parent').get()); return d.exists ? d.data().pinHash : null; }
    return (this.local('parent') || {}).pinHash || null;
  },
  async setParentHash(h) {
    if (this.db) return this.db.doc('settings/parent').set({ pinHash: h });
    this.local('parent', { pinHash: h });
  },
  async catalog() {
    let c;
    if (this.db) { const d = await this.timeout(this.db.doc('settings/catalog').get()); c = d.exists ? d.data() : null; }
    else c = this.local('catalog');
    this.cat = { hiddenSubjects: [], hiddenExams: [], deletedExams: [], ...(c || {}) };
    return this.cat;
  },
  async setCatalog(c) {
    this.cat = c;
    if (this.db) return this.db.doc('settings/catalog').set(c);
    this.local('catalog', c);
  },
  async records(kidId) {
    if (this.db) {
      const snap = await this.timeout(this.db.collection(`kids/${kidId}/records`).get());
      const r = {}; snap.docs.forEach(d => r[d.id] = d.data()); return r;
    }
    return this.local('rec-' + kidId) || {};
  },
  // newAttempt=true：這次是新的一次考試；false：同一次考試裡家長改了批改結果
  async setWallet(kidId, w) {
    if (this.db) return this.db.doc(`kids/${kidId}/records/_wallet`).set(w);
    const all = this.local('rec-' + kidId) || {}; all._wallet = w; this.local('rec-' + kidId, all);
  },
  async setWrong(kidId, m) {
    if (this.db) return this.db.doc(`kids/${kidId}/records/_wrongq`).set(m);
    const all = this.local('rec-' + kidId) || {}; all._wrongq = m; this.local('rec-' + kidId, all);
  },
  async setMistakes(kidId, m) {
    if (this.db) return this.db.doc(`kids/${kidId}/records/_mistakes`).set(m);
    const all = this.local('rec-' + kidId) || {}; all._mistakes = m; this.local('rec-' + kidId, all);
  },
  async saveRecord(kidId, examId, score, newAttempt) {
    const all = this.db ? null : (this.local('rec-' + kidId) || {});
    let rec;
    if (this.db) { const d = await this.db.doc(`kids/${kidId}/records/${examId}`).get(); rec = d.exists ? structuredClone(d.data()) : null; }
    else rec = all[examId] || null;
    rec = rec || { history: [] };
    const h = rec.history || [];
    if (newAttempt || !h.length) h.push({ score, date: today() }); else h[h.length - 1] = { score, date: today() };
    rec = { score, date: today(), attempts: h.length, best: Math.max(...h.map(x => x.score)), history: h.slice(-20) };
    if (this.db) await this.db.doc(`kids/${kidId}/records/${examId}`).set(rec);
    else { all[examId] = rec; this.local('rec-' + kidId, all); }
  }
};
Store.ready = (async () => {
  try { if (window.claude && claude.use) Store.db = await claude.use('db'); } catch (e) { Store.db = null; }

/* ---------- 密碼（存的是加密後的雜湊值，不是密碼本身） ---------- */
async function hashPin(pin, salt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function newSalt() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

}

/* ---------- 錯題解釋與常錯區（各科） ---------- */
let wrongChain = Promise.resolve();
const PLACE = ['個位', '十位', '百位', '千位', '萬位'];
function vertSteps(q) {
  const T = String(q.top).split('').reverse().map(Number), B = String(q.bot).split('').reverse().map(Number), n = Math.max(T.length, B.length), out = [];
  let c = 0;
  for (let i = 0; i < n; i++) {
    const t = T[i] || 0, b = B[i] || 0;
    if (q.op === '+') {
      const sum = t + b + c, txt = `${PLACE[i]}：${t}＋${b}${c ? '＋1（進位）' : ''}＝${sum}`;
      c = sum >= 10 ? 1 : 0;
      out.push(c ? `${txt}，寫 ${sum % 10}，進 1 到${PLACE[i + 1]}` : `${txt}，寫 ${sum}`);
    } else {
      let v = t - c, txt = `${PLACE[i]}：${t}${c ? '－1（被借走）' : ''}`;
      if (v < b) { txt += `${c ? '後' : ' '}不夠減，向${PLACE[i + 1]}借 1，變成 ${v + 10}`; v += 10; c = 1; } else c = 0;
      if (i === n - 1 && v - b === 0) txt += `，${v}－${b}＝0（最前面的 0 不用寫）`; else txt += `，${v}－${b}＝${v - b}`;
      out.push(txt);

function syncAwards() {
  // 獎勵卡規則（每份考卷只算一次，同一份拿過 100 分就不再累計）：
  //   100 分：第 1～4 份各送 1 張金卡，累積到第 5、10、15… 份時改送 1 張鑽石卡
  //   90～99 分：第 1～9 份各送 1 張優點卡，累積到第 10、20… 份時改送 1 張金卡
  //   80～89 分：每份送 1 張優點卡
  const w = walletRaw(), got = { diamond: 0, gold: 0, merit: 0 };
  const recs = Object.entries(curKid.rec || {}).filter(([k]) => !k.startsWith('_') && isCardExam(k)).map(([id, r]) => [id, examPercent(id, r)]).filter(([, p]) => p !== null);

    w.v2 = { lv: {}, c100: 0, c90: 0 };
    recs.forEach(([id, p]) => { const L = lvl(p); if (!L) return; w.v2.lv[id] = L; if (L === 3) w.v2.c100++; if (L === 2) w.v2.c90++; });
    saveWallet(w); return got;
  }
  recs.forEach(([id, p]) => {
    const L = lvl(p), prev = w.v2.lv[id] || 0;
    if (L <= prev) return;
    w.v2.lv[id] = L;
    if (L === 3) { w.v2.c100++; if (w.v2.c100 % 5 === 0) { w.cards.diamond++; got.diamond++; } else { w.cards.gold++; got.gold++; } }
    else if (L === 2) { w.v2.c90++; if (w.v2.c90 % 10 === 0) { w.cards.gold++; got.gold++; } else { w.cards.merit++; got.merit++; } }
    else if (L === 1) { w.cards.merit++; got.merit++; }
  });
  if (got.diamond || got.gold || got.merit) saveWallet(w);
  return got;
}

/* ---------- 手寫比對：把我寫的字和正確的字縮放到同樣大小，比較筆畫位置有沒有大致重疊 ---------- */

    A.forEach((v, i) => { if (v) { na++; if (near(B, i)) hitA++; } });   // 我寫的筆畫，有多少落在字的附近

/* ---------- 平板數字鍵盤（不跳出系統鍵盤，按鍵大、不會誤觸） ---------- */
const NumKey = (function () {
  const k = document.createElement('div'); k.className = 'numkey';
  k.innerHTML = '<div class="nkrow"></div>';
  const grid = k.firstChild;
  ['1','2','3','4','5','6','7','8','9','⌫','0','確定'].forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
    if (t === '確定') b.className = 'primary'; if (t === '⌫') b.className = 'bs';
    b.onclick = () => press(t); grid.append(b);
  });
  let f = null;
  function press(t) {
    if (!f) return; SFX.tap();
    if (t === '確定') { const ff = f; close(); ff.confirm && ff.confirm(); return; }
    if (t === '⌫') { f.back(); return; }
    f.digit(t);
  }
  function open(field) {
    if (f && f !== field) f.blur && f.blur();
    f = field; f.focus && f.focus();
    if (!k.isConnected) document.body.append(k);
    k.classList.add('show'); document.body.classList.add('nkopen');
    const r = field.el.getBoundingClientRect();
    if (r.bottom > window.innerHeight - 330) window.scrollBy({ top: r.bottom - (window.innerHeight - 340), behavior: 'smooth' });
  }
  function close() { if (f) f.blur && f.blur(); f = null; k.classList.remove('show'); document.body.classList.remove('nkopen'); }
  return { open, close, get field() { return f; } };
})();
function inputField(inp, onConfirm) {
  return { el: inp,
    focus() { inp.classList.add('kfocus'); }, blur() { inp.classList.remove('kfocus'); },
    digit(d) { if (inp.value.length < 6) inp.value += d; }, back() { inp.value = inp.value.slice(0, -1); },
    confirm() { onConfirm ? onConfirm() : inp.dispatchEvent(new Event('change')); } };
}
function numInput(onConfirm) {
  const inp = el('input', 'ans num'); inp.readOnly = true; inp.inputMode = 'none'; inp.autocomplete = 'off';
  inp.addEventListener('click', () => { if (!inp.disabled && !(state && state.graded)) NumKey.open(inputField(inp, onConfirm)); });
  return inp;
}
function checkNumset(it, fromSubmit) {
  if (it.done) return;
  const vals = it.getVals();
  if (!fromSubmit && vals.some(v => v === '')) return;
  it.done = true;
  it.ok = vals.every((v, i) => v !== '' && norm(v) === norm(it.answer[i]));
  it.lock();
  it.showResult(it.ok);
  setQMark(it); recordJudge(it, vals.every(v => v === ''));
  if (!fromSubmit && state.battle) it.ok ? state.battle.hit(it.points, it.el.querySelector('.qt') || it.el) : state.battle.miss();
}

function liveCheck(it) {
  it.input.addEventListener('change', () => {
    if (!state.battle || state.graded || it.done || !it.input.value.trim()) return;
    it.done = true;
    it.ok = [].concat(it.answer).map(norm).includes(norm(it.input.value));
    it.input.disabled = true; it.input.classList.add(it.ok ? 'right' : 'wrong');
    if (!it.ok) it.input.after(el('span', 'fixtxt', `正確：${[].concat(it.answer)[0]}`));
    setQMark(it); recordJudge(it);
    it.ok ? state.battle.hit(it.points, it.input) : state.battle.miss();
  });
  it.input.addEventListener('keydown', e => { if (e.key === 'Enter') it.input.blur(); });
}
function answerInput(q) {
  if (q.num) return numInput();
  const inp = el('input', 'ans');
  inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
  if (q.num) inp.inputMode = 'decimal';
  return inp;
}
function add(it) { it.ok = null; it.idx = state.items.length; state.items.push(it); return it; }

/* ---------- 考卷 ---------- */
function renderExam(ex) {
  const s = SUBJECTS.find(x => x.id === ex.subject);
  state = { ex, items: [], graded: false, saved: false }; pads = [];
  setHeader(`${curKid.name}・${s.name}・${ex.title}`, () => renderKid(curKid).then(() => renderSubject(ex.subject)));
  app.innerHTML = '';
  const heads = [];
  ex.sections.forEach(sec => {
    const box = el('section', 'sec');
    if (sec.title) {
      const h = el('h2', null, sec.title); const sm = el('small'); h.append(sm);
      heads.push({ sm, from: state.items.length, type: sec.type, sec });
      box.append(h);
    } else { box.style.marginTop = '-14px'; box.style.borderTop = 'none'; box.style.borderTopLeftRadius = box.style.borderTopRightRadius = '0'; }
    RENDER[sec.type](sec, box);
    app.append(box);
  });
  // 依比例換算成 100 分：每一大題顯示占幾分、每格（題）約幾分
  const examTotal = state.items.reduce((a, i) => a + i.points, 0) || 1;
  const fmt = n => (Math.round(n * 10) / 10).toString();
  const yue = n => Math.abs(n - Math.round(n)) < 1e-9 ? '' : '約';
  heads.forEach((h, k) => {
    const its = state.items.slice(h.from, k + 1 < heads.length ? heads[k + 1].from : state.items.length);
    if (!its.length) return;
    const share = its.reduce((a, i) => a + i.points, 0) / examTotal * 100;
    const same = its.every(i => i.points === its[0].points);
    const unit = h.type === 'zhuyin' || h.type === 'boxes' ? '格' : '題';
    if (h.sec.perItem) { h.sm.textContent = `（共 ${h.sec.items.length} 題，每題 ${h.sec.perItem} 分，滿分 ${Math.round(h.sec.items.length * h.sec.perItem)}）`; return; }
    h.sm.textContent = heads.length === 1
      ? `（共 ${its.length} ${unit}，每${unit}${yue(100 / its.length)} ${fmt(100 / its.length)} 分，滿分 100）`
      : `（${fmt(share)} 分${same ? `，每${unit}${yue(its[0].points / examTotal * 100)} ${fmt(its[0].points / examTotal * 100)} 分` : ''}）`;
  });
  const bar = el('div', 'submitbar');
  const sub = el('button', 'primary', '交卷'); sub.onclick = submit;
  bar.append(sub); app.append(bar);
  const autoHP = state.items.filter(i => i.type === 'choice' || i.type === 'text' || i.type === 'numset').reduce((a, i) => a + i.points, 0);
  if (autoHP > 0) {
    const maxed = !ex.practice && isMaxed(ex.id);
    state.battle = createBattle({ subject: ex.subject, maxHP: Math.round(autoHP * 10) / 10, kidAvatar: curKid.avatar, kidName: curKid.name, noCoin: maxed,
      onDeath: () => { if (state && state.ex === ex) { state.graded = true; showGameOver(() => renderExam(ex)); } } });
    if (maxed) app.prepend(maxedNote());
    app.prepend(state.battle.el);
    if (!parentMode) { const hb = el('button', 'hintbtn ticketbtn'); hb.onclick = useHint; state.battle.el.querySelector('.fighter.me').append(hb); updateHintBtn(); }
  }
  pads.forEach(p => p.size());
  window.scrollTo(0, 0);
}

function norm(s) {
  return String(s).replace(/[０-９ａ-ｚＡ-Ｚ．]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248))
    .replace(/\s/g, '').toLowerCase();
}
function setQMark(it) { it.el.classList.toggle('is-ok', it.ok === true); it.el.classList.toggle('is-ng', it.ok === false); }

function submit() {
  if (state.graded) return;
  NumKey.close();
  state.graded = true;
  state.items.forEach(it => {
    if (it.type === 'choice') {
      it.ok = it.resp === it.answer;
      it.opts[it.answer].classList.add('right');
      if (it.resp !== null && !it.ok) it.opts[it.resp].classList.add('wrong');
      setQMark(it); recordJudge(it, it.resp === null);
    } else if (it.type === 'multi') {
      const want = new Set(it.answer);
      it.ok = want.size === it.resp.size && [...want].every(k => it.resp.has(k));
      it.opts.forEach((b, k) => { if (want.has(k)) b.classList.add('right'); else if (it.resp.has(k)) b.classList.add('wrong'); });
      setQMark(it); recordJudge(it, !it.resp.size);
    } else if (it.type === 'write') {
      if (it.pad.item.strokes.length) {
        const r = it.cv.getBoundingClientRect(), W = 900, H = Math.round(W * r.height / r.width);
        const off = document.createElement('canvas'); off.width = W; off.height = H;
        const c = off.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
        paint(c, W, H, it.pad.item.strokes, 3.5); it.img = off.toDataURL();
      }
    } else if (it.type === 'numset') {
      checkNumset(it, true);
    } else if (it.type === 'text' && it.done) {
      // 作答時已經判定過
    } else if (it.type === 'text') {
      const acc = [].concat(it.answer).map(norm);
      it.ok = it.input.value.trim() !== '' && acc.includes(norm(it.input.value));
      it.input.disabled = true; it.input.classList.add(it.ok ? 'right' : 'wrong');
      if (!it.ok) it.input.after(el('span', 'fixtxt', `正確：${[].concat(it.answer)[0]}`));
      setQMark(it); recordJudge(it, it.input.value.trim() === '');
    }
  });
  document.querySelector('.submitbar').remove();

  const manual = manualItems();
  if (manual.length) {
    const sec = el('section', 'sec');
    sec.append(el('h2', null, '家長批改：手寫題'));
    sec.append(el('p', 'hint', '有寫的格子都先算對，看到寫錯的就按 ✕，分數會自動扣掉；按錯了再按 ○ 改回來。空白的格子自動算錯。'));
    const cards = el('div', 'cards');
    manual.forEach(it => {
      const wide = it.type === 'write';
      const c = el('div', 'card' + (wide ? ' wide' : ''));
      const kid = el('div', 'kid', it.img ? null : '空白'); if (it.img) kid.innerHTML = `<img src="${it.img}">`;
      let r;
      if (wide) { r = el('div', 'ansbox', it.el.querySelector('.qt').textContent.split('\n')[0]); r.append(el('b', null, '參考：' + it.ref)); }
      else { r = el('div', 'ansbox' + (it.zyMode ? ' zy' : ''), it.zyMode ? `「${it.c}」` : it.z); r.append(el('b', null, it.answer)); }
      const mk = el('div', 'mk'); const okb = el('button', null, '○'), ngb = el('button', null, '✕'); mk.append(okb, ngb);
      c.append(kid, r, mk); cards.append(c);
      it.okb = okb; it.ngb = ngb;
      okb.onclick = () => { if (it.ok !== true) SFX.coin(); markHand(it, true); }; ngb.onclick = () => { if (it.ok !== false) SFX.ah(); markHand(it, false); };
      if (!it.img) markHand(it, false, true); else markHand(it, true, true);
    });
    sec.append(cards); app.append(sec);
  }
  const again = el('div', 'submitbar'); const b = el('button', null, '重新作答'); b.onclick = () => renderExam(state.ex);
  again.append(b); app.append(again);
  updateScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function markHand(it, v, quiet) {
  it.ok = v;
  if (it.type === 'write') setQMark(it);
  else {
    it.el.classList.toggle('ok', v === true); it.el.classList.toggle('ng', v === false);
    it.el.querySelector('.fix')?.remove();
    if (v === false) it.el.append(el('span', 'fix', it.answer));
  }
  it.okb.classList.toggle('on', v === true); it.ngb.classList.toggle('on', v === false);
  if (!quiet) updateScore();
}
function updateScore() {
  const total = state.items.reduce((s, i) => s + i.points, 0);
  const got = state.items.reduce((s, i) => s + (i.ok === true ? i.points : 0), 0);
  const todo = state.items.filter(i => i.ok === null).length;
  const score = Math.round(got / total * 100);
  scoreEl.textContent = `得分 ${score}` + (todo ? `（還有 ${todo} 格待批改）` : '');
  if (!todo) {
    const now = new Map();
    state.items.filter(i => i.type === 'hand' && !i.zyMode && i.z && i.img && i.ok === false && /^\p{Script=Han}$/u.test(i.answer)).forEach(i => now.set(i.answer, i));
    const prev = state.mistSet || new Map(), ch = [];
    now.forEach((i, c) => { if (!prev.has(c)) ch.push({ c, z: i.z, w: i.w, delta: 1 }); });
    prev.forEach((i, c) => { if (!now.has(c)) ch.push({ c, delta: -1 }); });
    state.mistSet = now; bumpMistakes(ch);
  }
  if (!todo && !state.celebrated) { state.celebrated = true; celebrate(score); }
  if (!todo && score !== state.savedScore && !state.ex.practice) {
    const first = !state.saved; state.saved = true; state.savedScore = score;
    const st = state;
    st.saving = (st.saving || Promise.resolve()).then(() => Store.saveRecord(curKid.id, st.ex.id, score, first))
      .catch(() => { scoreEl.textContent += '（成績沒存成功）'; });
  }
}

  <svg class="near" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200 L0 110 Q150 60 300 100 T600 90 T900 100 T1200 80 L1200 200Z" fill="#4e3570"/><path d="M0 200 L0 150 Q200 120 400 150 T800 140 T1200 150 L1200 200Z" fill="#5a3b26"/></svg>
